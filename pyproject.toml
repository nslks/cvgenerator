[project]
name = "cvgenerator"
version = "0.1.0"
description = "Data-driven CV generator: YAML → Pydantic → Jinja2 → XeLaTeX → PDF"
readme = "README.md"
authors = [
    { name = "Enes Alkis" }
]
requires-python = ">=3.13"
dependencies = [
    "pydantic[email]>=2.9",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "typer>=0.15",
]

[project.scripts]
cvgenerator = "cvgenerator.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "syrupy>=4.7",
]

[build-system]
requires = ["uv_build>=0.9.29,<0.10.0"]
build-backend = "uv_build"
